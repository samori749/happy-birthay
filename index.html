const tp={};function textPts(s){if(tp[s])return tp[s];const c=document.createElement('canvas');c.width=512;c.height=128;const x=c.getContext('2d');x.fillStyle='#fff';x.textAlign='center';x.textBaseline='middle';let z=104;x.font='800 '+z+'px system-ui,sans-serif';while(x.measureText(s).width>490){z-=6;x.font='800 '+z+'px system-ui,sans-serif'}x.fillText(s,256,66);const d=x.getImageData(0,0,512,128).data,o=[];for(let j=0;j<128;j+=3)for(let i=0;i<512;i+=3)if(d[(j*512+i)*4+3]>128)o.push([(i-256)/512,(64-j)/512]);return tp[s]=o}

const sg=new THREE.BufferGeometry(),sp=new Float32Array(1500);for(let i=0;i<500;i++){const u=R()*.9+.1,t=R()*TAU,r=45;sp[i*3]=Math.cos(t)*r*Math.sqrt(1-u*u);sp[i*3+1]=u*r;sp[i*3+2]=Math.sin(t)*r*Math.sqrt(1-u*u)}sg.setAttribute('position',new THREE.BufferAttribute(sp,3));stars=new THREE.Points(sg,new THREE.PointsMaterial({size:.25,color:0xffffff,fog:false}));scene.add(stars);
const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(P,3));g.setAttribute('color',new THREE.BufferAttribute(C,3));spark=new THREE.Points(g,new THREE.PointsMaterial({size:.34,map:glowTex,vertexColors:true,blending:2,transparent:true,depthWrite:false,toneMapped:false,sizeAttenuation:true}));spark.frustumCulled=false;scene.add(spark);

loop()}

function buildCake(){if(cake)scene.remove(cake);if(greet)scene.remove(greet);if(badge)scene.remove(badge);cake=new THREE.Group();flames=[];
const M=(c,o)=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.45},o||{}));
const cyl=(r,h,y,c,o)=>{const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,48),M(c,o));m.position.y=y;m.castShadow=m.receiveShadow=true;cake.add(m);return m};
cyl(3,.16,.08,0xdddde8,{metalness:.8,roughness:.2});
const sph=(r,x,y,z,c)=>{const m=new THREE.Mesh(new THREE.SphereGeometry(r,14,10),M(c,{roughness:.25}));m.position.set(x,y,z);cake.add(m)};
[[2.2,1,.66,0xff8fb8,1.16],[1.6,.9,1.61,0xfff1d6,2.06],[1.1,.8,2.46,0x8a5a44,2.86]].forEach(t=>{cyl(t[0],t[1],t[2],t[3]);const ic=new THREE.Mesh(new THREE.TorusGeometry(t[0],.09,10,64),M(0xffffff));ic.rotation.x=Math.PI/2;ic.position.y=t[4];cake.add(ic);for(let i=0;i<30;i++){const a=i/30*TAU;sph(.13,Math.cos(a)*t[0],t[4]-.08-R()*.12,Math.sin(a)*t[0],0xffffff)}});
for(let i=0;i<10;i++){const a=i/10*TAU;sph(.17,Math.cos(a)*1.9,1.32,Math.sin(a)*1.9,0xd90429)}
for(let i=0;i<8;i++){const a=i/8*TAU;sph(.16,Math.cos(a)*1.35,2.22,Math.sin(a)*1.35,0xff5d8f)}
const top=2.86,cn=Math.min(age,14);
for(let i=0;i<cn;i++){let r,a;if(i<9){r=.72;a=i/Math.min(cn,9)*TAU}else{r=.3;a=(i-9)/(cn-9)*TAU}const x=Math.cos(a)*r,z=Math.sin(a)*r;
const c=new THREE.Mesh(new THREE.CylinderGeometry(.05,.05,.55,10),M(PAL[i%6]));c.position.set(x,top+.275,z);cake.add(c);
const f=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,color:0xffa733,blending:2,depthWrite:false,transparent:true})),f2=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,color:0xffffff,blending:2,depthWrite:false,transparent:true}));
f.position.set(x,top+.8,z);f2.position.set(x,top+.74,z);cake.add(f,f2);flames.push({f,f2,x,y:top+.8,z,k:1,out:false})}
fl=new THREE.PointLight(0xffa040,1.6,11);fl.position.set(0,top+1,0);cake.add(fl);cake.scale.setScalar(.001);scene.add(cake);
const bc=document.createElement('canvas');bc.width=bc.height=256;const x=bc.getContext('2d');x.beginPath();x.arc(128,128,118,0,TAU);x.fillStyle='#ffd166';x.fill();x.lineWidth=10;x.strokeStyle='#fff';x.stroke();x.fillStyle='#7a1f4d';x.textAlign='center';x.textBaseline='middle';x.font='800 '+(String(age).length>2?100:140)+'px system-ui,sans-serif';x.fillText(age,128,138);
badge=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(bc)}));badge.scale.set(.95,.95,1);badge.position.set(0,1.61,1.75);scene.add(badge);
greet=txtSprite([['С Днём Рождения!',130],[full,120],['Тебе '+age+' '+plural(age)+'! 🎂',110]],1200,560,11);greet.position.set(0,6.4,-3);greet.material.opacity=0;scene.add(greet)}
/* ---------- flow ---------- */
function setFx(){const f=FX[fxI],tb=$('#tabs');$('#fx').textContent='✨ Анимация '+(fxI+1)+' из 20 · '+f[0];acc=.6;tc=0;[...tb.children].forEach((b,i)=>b.classList.toggle('on',i==fxI));const b=tb.children[fxI];if(b)tb.scrollTo({left:b.offsetLeft-innerWidth/2+b.offsetWidth/2,behavior:'smooth'})}

FX.forEach((f,i)=>{const b=document.createElement('button');b.textContent=(i+1)+'. '+f[0];b.onclick=()=>pick(i);$('#tabs').appendChild(b)});
function showWish(){const e=$('#wish');e.textContent=WISH[wishI++%WISH.length].replace(/\{n\}/g,name);e.classList.remove('show');void e.offsetWidth;e.classList.add('show')}
function start(){const a=$('#fn').value.trim(),b=$('#ln').value.trim(),g=parseInt($('#ag').value,10);
if(!a||!b){$('#err').textContent='Введи имя и фамилию';return}if(!(g>=1&&g<=150)){$('#err').textContent='Возраст — число от 1 до 150';return}
name=a;full=a+' '+b;age=g;$('#err').textContent='';
if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}
if(AC&&AC.state=='suspended'&&!mute)AC.resume();
$('#form').style.display='none';$('#hud').classList.add('on');$('#hint').style.display='';$('#tabs').classList.remove('on');auto=false;$('#au').style.opacity=.5;$('#fx').textContent='';$('#wish').className='';$('#wish').textContent='';
if(!ren)initScene();clearItems();state='cake';intro=0;blowT=0;fxI=0;fxT=0;wishI=0;wishT=9;buildCake();camPos.set(0,3.6,9);onResize();camTgt.set(0,2.2,0);melody()}
function blowOut(){if(state!='cake')return;state='blow';blowT=0;$('#hint').style.display='none';$('#wish').textContent='Загадывай желание… ✨';$('#wish').className='show'}
function back(){state='form';$('#hud').classList.remove('on');$('#form').style.display='flex';if(AC)AC.suspend().then(()=>{if(!mute)AC.resume()})}
$('#go').onclick=start;['fn','ln','ag'].forEach(i=>$('#'+i).addEventListener('keydown',e=>{if(e.key=='Enter')start()}));
addEventListener('keydown',e=>{if(e.code=='Space'&&state=='cake'){e.preventDefault();blowOut()}});
$('#blow').onclick=blowOut;$('#back').onclick=back;$('#au').onclick=()=>{auto=!auto;$('#au').style.opacity=auto?1:.5};$('#au').style.opacity=.5;
$('#mu').onclick=()=>{mute=!mute;$('#mu').textContent=mute?'🔇':'🔊';if(AC)mute?AC.suspend():AC.resume()};
/* ---------- loop ---------- */
function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;stars.rotation.y+=dt*.01;
if(state!='form'&&cake){
if(intro<1){intro=Math.min(1,intro+dt*.8);const c1=1.70158,c3=c1+1,e=1+c3*Math.pow(intro-1,3)+c1*Math.pow(intro-1,2);cake.scale.setScalar(Math.max(.001,e))}
if(!drag)cake.rotation.y+=dt*.3;
if(state=='cake'){fl.intensity=1.5+Math.sin(t*15)*.25}
if(state=='blow'){blowT+=dt;fl.intensity=1.6*Math.max(0,1-blowT*1.5);flames.forEach((f,i)=>{if(f.out)return;f.k=Math.max(0,1-(blowT*2.2-i*.07));if(f.k<=0){f.out=true;f.f.visible=f.f2.visible=false;smoke(cake.localToWorld(new THREE.Vector3(f.x,f.y,f.z)))}});
if(blowT>1.8){state='fire';fxT=0;$('#tabs').classList.add('on');setFx();camPos.set(0,3.2,12.5);onResize();camTgt.set(0,3.6,0);showWish();wishT=0}}
flames.forEach((f,i)=>{if(f.out)return;const w=1+.15*Math.sin(t*20+i);f.f.scale.set(.34*w*f.k,.55*(1+.2*Math.sin(t*17+i*2))*f.k,1);f.f2.scale.set(.14*f.k,.26*f.k,1);f.f.position.x=f.x+Math.sin(t*9+i)*.015*(1+blowT*8)});
if(state=='fire'){
fxT+=dt;acc+=dt;const k=FX[fxI][1];
if(typeof k=='number'){if(acc>(tc%2?1.2:1.8)){acc=0;launch(k)}}
else if(k=='helix'){for(let j=0;j<8;j++){const a=fxT*5+j*.8,y=((fxT*1.3+j*.125)%1)*9,c=new THREE.Color().setHSL((j/8+fxT*.2)%1,1,.6);emit(Math.cos(a)*3.2,y,Math.sin(a)*3.2,0,.5,0,c.r,c.g,c.b,1.6,0,.9);emit(Math.cos(a+Math.PI)*3.2,y,Math.sin(a+Math.PI)*3.2,0,.5,0,c.r,c.g,c.b,1.6,0,.9)}}
else{const rate={confetti:.06,balloon:.35,heart:.28,star:.15,gift:.4,lantern:.33,ring:.25}[k];if(acc>rate){acc=0;for(let j=0;j<(k=='confetti'?3:1);j++)mkItem(k)}}
if(auto&&fxT>6.2){fxT=0;fxI=(fxI+1)%20;setFx()}
wishT+=dt;if(wishT>3.8){wishT=0;showWish()}
greet.material.opacity+=((typeof k=='number'?0:1)-greet.material.opacity)*dt*2;greet.position.y=6.4+Math.sin(t*1.5)*.15}
}
for(let i=rockets.length-1;i>=0;i--){const r=rockets[i];r.y+=r.vy*dt;r.vy-=9*dt;emit(r.x,r.y,r.z,(R()-.5)*.4,-1-R(),(R()-.5)*.4,1,.8,.45,.5,1,.5);if(r.vy<1){r.s?textBurst(r.x,r.y,r.z,r.s):burst(r.x,r.y,r.z,r.ty);rockets.splice(i,1)}}
for(let i=items.length-1;i>=0;i--){const it=items[i];it.life-=dt;it.m.position.addScaledVector(it.v,dt);if(it.sw)it.m.position.x+=Math.sin(t*2+it.ph)*.6*dt;it.m.rotation.x+=it.sp.x*dt;it.m.rotation.y+=it.sp.y*dt;it.m.rotation.z+=it.sp.z*dt;if(it.sw){it.m.rotation.x=0;it.m.rotation.z=Math.sin(t*2+it.ph)*.15}if(it.life<=0||it.m.position.y<-4||it.m.position.y>12){scene.remove(it.m);items.splice(i,1)}}
flash.intensity*=Math.pow(.02,dt);updSpark(dt);
cam.position.lerp(camPos,dt*1.5);look.lerp(camTgt,dt*1.5);cam.lookAt(look);
